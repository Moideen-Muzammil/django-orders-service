replicaCount: 3
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi
env:
  APP_ENV: prod
  ALLOWED_HOSTS: "localhost,127.0.0.1,orders-service,orders-service.prod.svc.cluster.local"
